name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: ZIP entpacken
        run: unzip -q LidarAufmass.zip

      - name: XcodeGen installieren
        run: brew install xcodegen

      - name: Xcode-Projekt erzeugen
        working-directory: LidarAufmass
        run: xcodegen

      - name: App bauen (ohne Signatur)
        working-directory: LidarAufmass
        run: |
          xcodebuild \
            -project LidarAufmass.xcodeproj \
            -target LidarAufmass \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: IPA packen
        working-directory: LidarAufmass
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/LidarAufmass.app Payload/
          zip -qry LidarAufmass.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: LidarAufmass-ipa
          path: LidarAufmass/LidarAufmass.ipa
